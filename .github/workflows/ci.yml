name: CI

# プルリクエストとmain/masterブランチへのプッシュ時に実行
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

# 必要な権限を設定
permissions:
  contents: read
  pull-requests: write

jobs:
  # Lintとテストのジョブ
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint || true
        continue-on-error: true

      - name: Check code formatting with Prettier
        run: yarn format:check


      - name: Run tests
        run: yarn test:ci || yarn test || echo "No tests configured"
        continue-on-error: true

      - name: Build application
        run: yarn build

      - name: Check bundle size
        run: |
          echo "Build size report:"
          du -sh public/
          find public -name "*.js" -o -name "*.css" | xargs ls -lh | sort -k5 -hr | head -20

  # 依存関係の脆弱性チェック
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run security audit
        run: |
          yarn audit --level moderate || true
          echo "Security audit completed. Check the results above."
        continue-on-error: true

  # コード品質チェック
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check for unused dependencies
        run: |
          npx depcheck --ignores="@fontsource-variable/*" || true
        continue-on-error: true

      - name: Check for outdated dependencies
        run: |
          echo "Outdated dependencies:"
          yarn outdated || true
        continue-on-error: true
